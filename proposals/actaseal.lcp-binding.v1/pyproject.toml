[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcp-actaseal-binding"
version = "0.1.0"
description = "Legal Context Protocol (LCP) binding profile: terms fingerprint bound to a policy decision receipt"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [
    { name = "ActaSeal" },
]
keywords = ["legal-context-protocol", "lcp", "agentic-commerce", "atrHash"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://legalcontextprotocol.org"
Specification = "https://github.com/legal-context-protocol/legal-context-protocol"
Source = "https://github.com/legal-context-protocol/legal-context-protocol"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lcp_actaseal_binding = ["py.typed"]
